[project]
name = "reliable-data-intake-pipeline"
version = "1.0.0"
description = "Synthetic FastAPI demonstration for reliable external contact data intake."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
